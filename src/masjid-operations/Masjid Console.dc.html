<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="../support.js"></script>
<script src="../_theme/chrome.js"></script>
<!-- Shared state model + storyboard frame table. Plain JS in <head> so it is ready
     before the page logic below constructs its initial state. -->
<script src="./storyboards/broadcast-studio-state.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="../_ds/noor-design-system-46f42e91-1858-412f-bdb6-560a6cc3df9f/colors_and_type.css">
  <link rel="stylesheet" href="../_theme/poc.css">
  <link rel="stylesheet" href="../_theme/components.css">
  <link rel="stylesheet" href="../_theme/icons.css">
  <script src="../_ds/noor-design-system-46f42e91-1858-412f-bdb6-560a6cc3df9f/_ds_bundle.js"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&amp;display=block">
  <style>
    body{background:var(--canvas-bg);padding:36px 32px 90px;min-height:100vh;box-sizing:border-box}
    ::-webkit-scrollbar{display:none}*{-ms-overflow-style:none;scrollbar-width:none}
    /* Page chrome only — component constructions live in _theme/components.css. */
    .ops-rec-dot{width:12px;height:12px;flex-shrink:0;border-radius:var(--radius-circle);
      background:var(--color-status-error);animation:ops-pulse var(--motion-celebration) ease-in-out infinite}
    @keyframes ops-pulse{0%,100%{opacity:1}50%{opacity:var(--opacity-low)}}
    @keyframes ops-step{from{transform:translateX(24px);opacity:0}to{transform:translateX(0);opacity:1}}
    .ops-step{animation:ops-step var(--motion-standard) cubic-bezier(.2,.8,.2,1)}


    /* ── Console header & feed chrome (page layout for the console screen) ── */
    .console-head{display:flex;align-items:center;gap:var(--size-lg);padding:54px 16px 14px;box-sizing:border-box}
    .console-head-copy{flex:1;min-width:0}
    .console-head-name{display:flex;align-items:center;gap:var(--size-md);max-width:100%;min-height:44px;padding:0;border:0;background:transparent;text-align:left;font:inherit;color:inherit}
    .console-head-verified{flex-shrink:0;font-size:var(--icon-sm);color:var(--color-neutral-brand)}
    .console-head-swap{flex-shrink:0;font-size:20px;color:var(--color-info-secondary)}
    .console-head-name:active .console-head-swap{color:var(--color-action-primary)}
    .console-head-role{margin-top:2px;font-size:12px;color:var(--color-info-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .console-eyebrow{padding:var(--size-2xl) 4px var(--size-lg)}

    .console-feedhead{position:sticky;top:0;z-index:2;display:flex;align-items:baseline;gap:var(--size-md);padding:var(--size-2xl) 20px var(--size-lg);box-sizing:border-box;background:color-mix(in oklab,var(--color-surface-primary) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
    .console-feedhead-title{flex:1}
    .console-feedhead-count{font-size:12px;color:var(--color-info-secondary)}
    .console-day{padding:var(--size-lg) 20px var(--size-md);background:var(--color-surface-secondary)}
    .feed-post-head .ib.md{width:44px;height:44px}


    /* ── Committee screen ── */
    .member-caps{display:flex;align-items:center;gap:var(--size-md);min-width:0}
    .member-role{font-size:12px;color:var(--color-info-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .member-cap{flex-shrink:0;font-size:15px;color:var(--color-info-faint);opacity:var(--opacity-emphasis)}
    .member-cap.on{color:var(--color-action-primary);opacity:1}
    .committee-label{display:flex;align-items:baseline;gap:var(--size-md);padding:var(--size-max) 4px var(--size-lg)}
    .committee-label>span{padding:1px 7px;border-radius:var(--radius-circle);background:var(--color-action-background);font-size:10px;letter-spacing:0;color:var(--color-info-primary)}
    .committee-note{padding:var(--size-lg) 4px 0;font-family:var(--font-body);font-size:11px;line-height:1.5;color:var(--color-info-tertiary)}
    .committee-legend{display:flex;flex-wrap:wrap;gap:var(--size-md) var(--size-xl);padding:var(--size-max) 4px var(--size-md);font-family:var(--font-body);font-size:10.5px;color:var(--color-info-tertiary)}
    .committee-legend>span{display:inline-flex;align-items:center;gap:4px}
    .committee-legend .mi{font-size:14px;color:var(--color-action-primary)}


    /* ── Musalleen screen ── */
    .followers-more{display:flex;align-items:center;justify-content:space-between;gap:var(--size-lg);padding:var(--size-xl) 4px 0;font-family:var(--font-body);font-size:11.5px;color:var(--color-info-secondary)}
    .followers-note{display:flex;align-items:flex-start;gap:var(--size-md);padding:var(--size-max) 4px 0;font-family:var(--font-body);font-size:11px;line-height:1.5;color:var(--color-info-tertiary)}
    .followers-note .mi{flex-shrink:0;font-size:14px}

    /* ── Masjid details screen ── */
    /* Hero construction lives in the kit (.media-identity-hero); only the code line's tabular
       figures are page chrome. */
    .detail-hero-code{font-family:var(--font-body);font-size:11px;font-variant-numeric:tabular-nums;letter-spacing:.06em;color:color-mix(in oklab,var(--color-neutral-white) 84%,transparent)}
    .detail-group-label{padding:var(--size-max) 4px var(--size-lg)}
    .detail-group{margin-top:0;padding:0 var(--size-2xl)}
    .detail-field{display:flex;flex-direction:column;gap:2px;padding:var(--size-xl) 0}
    .detail-group .detail-field+.detail-field{border-top:1px solid var(--color-neutral-border)}
    .detail-label{font-family:var(--font-body);font-size:11.5px;color:var(--color-info-secondary)}
    .detail-value{font-family:var(--font-body);font-size:14px;line-height:1.45;color:var(--color-info-primary)}
    .detail-value.mono{font-variant-numeric:tabular-nums;letter-spacing:.02em}
    .detail-correction{margin-top:var(--size-max);border:1px solid var(--color-neutral-border);border-radius:var(--radius-card);background:var(--color-surface-card)}
    .detail-note{padding:var(--size-max) 4px 0;font-family:var(--font-body);font-size:11px;line-height:1.5;color:var(--color-info-tertiary)}

    /* ── Member screen header ── */
    .member-head-meta{display:flex;align-items:center;gap:var(--size-md);margin-top:2px;font-family:var(--font-body);font-size:12px;color:var(--color-info-secondary)}

    /* ── Invitations inbox ── */
    .invite-card{box-sizing:border-box;padding:var(--size-2xl);border:1px solid var(--color-neutral-border);border-radius:var(--radius-card);background:var(--color-surface-card)}
    .invite-card.accepted{border-color:color-mix(in oklab,var(--color-status-success) 40%,transparent);background:color-mix(in oklab,var(--color-status-success) 7%,var(--color-surface-card))}
    .invite-card.expired{background:var(--color-surface-secondary)}
    .invite-card.expired .invite-card-name,.invite-card.expired .invite-card-caps{opacity:var(--opacity-high)}
    .invite-card-head{display:flex;align-items:center;gap:var(--size-lg)}
    .invite-card-id{flex:1;min-width:0}
    .invite-card-city{margin-top:1px;font-family:var(--font-body);font-size:11.5px;color:var(--color-info-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .invite-card-tick{flex-shrink:0;font-size:var(--icon-md);color:var(--color-status-success)}
    .invite-card-open{width:100%;margin-top:var(--size-xl)}
    .invite-card-role{display:flex;align-items:baseline;gap:var(--size-md);margin-top:var(--size-xl);font-family:var(--font-body)}
    .invite-card-role-label{font-size:11px;color:var(--color-info-secondary)}
    .invite-card-role strong{font-size:14px;color:var(--color-info-primary)}
    .invite-card-caps{display:flex;flex-direction:column;gap:var(--size-md);margin-top:var(--size-lg);padding:var(--size-lg) var(--size-xl);border-radius:var(--radius-2xl);background:var(--color-action-background)}
    /* "This role has no permissions yet" is not good news. Action green announces what the user
       gains; an empty grant reverts to the neutral eyebrow colour so the two states cannot be
       mistaken for each other at a glance. */
    .invite-card-caps.empty{background:var(--color-surface-secondary)}
    .invite-card-caps.empty .invite-card-caps-label{color:var(--color-info-secondary)}
    .invite-card-caps-list{display:flex;flex-direction:column;gap:5px}
    .invite-card-cap{display:flex;align-items:center;gap:var(--size-md);font-family:var(--font-body);font-size:12.5px;color:var(--color-info-primary)}
    .invite-card-cap .mi{flex-shrink:0;font-size:15px;color:var(--color-action-primary)}
    .invite-card-caps-none{font-family:var(--font-body);font-size:11.5px;line-height:1.45;color:var(--color-info-secondary)}
    .invite-card-from{display:flex;align-items:center;gap:var(--size-md);margin-top:var(--size-lg);font-family:var(--font-body);font-size:11px;color:var(--color-info-secondary)}
    .invite-card-actions{display:flex;gap:var(--size-md);margin-top:var(--size-xl)}
    /* The capsule stands in the pair's slot: same height, so replacing two 48px buttons with
       one pill does not shorten the card mid-action. */
    .invite-card-actions.is-working{justify-content:center;align-items:center;min-height:var(--control-h-lg)}
    .invite-card-actions>.btn{flex:1}
    .invite-card-note{margin-top:var(--size-lg);font-family:var(--font-body);font-size:11px;line-height:1.5;color:var(--color-info-tertiary)}
    .invite-foot{padding:var(--size-lg) 4px 0;font-family:var(--font-body);font-size:11px;line-height:1.5;text-align:center;color:var(--color-info-tertiary)}

    /* ── Compose-a-paigham wizard (feature construction, same idiom as the
       registration wizard's page CSS). Tokens only. ── */
    .cmp-screen{width:100%;height:100%;box-sizing:border-box;position:relative;overflow:hidden;display:flex;flex-direction:column;background:var(--color-surface-primary);font-family:var(--font-body);color:var(--color-info-primary)}
    /* The wizard bar is the DS .app-bar (transparent + fading blur haze): it floats over
       .cmp-body, which carries --cmp-appbar-h of top inset so the steps scroll under it. */
    :root{--cmp-appbar-h:132px} /* 54 status inset + 48 control row + 12 gap + 4 stepbar + 14 */
    .cmp-appbar{flex-direction:column;align-items:stretch;gap:var(--size-xl);height:var(--cmp-appbar-h);padding:54px 20px 14px;box-sizing:border-box}
    .cmp-appbar-row{display:flex;align-items:center;gap:var(--size-xl)}
    .cmp-appbar-title{flex:1}
    .cmp-step-count{flex-shrink:0;font-size:12px;font-weight:700;white-space:nowrap;color:var(--color-info-secondary)}
    .cmp-body{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:calc(var(--cmp-appbar-h) + 12px) 20px 18px;box-sizing:border-box}
    .cmp-head{margin-bottom:var(--size-huge)}
    .cmp-title{font-family:var(--font-title);font-size:27px;line-height:1.18;letter-spacing:-.5px}
    .cmp-sub{margin-top:var(--size-lg);font-size:14.5px;line-height:1.55;color:var(--color-info-secondary)}

    /* step 1 · message / voice */
    .cmp-textarea .inner{align-items:flex-start;min-height:168px;padding:14px 16px}
    .cmp-textarea textarea{width:100%;border:0;outline:0;background:transparent;resize:none;white-space:pre-wrap;font-family:var(--font-body);font-size:16px;line-height:1.5;color:var(--color-input-text)}
    .cmp-counter-row{display:flex;align-items:flex-start;gap:var(--size-xl);margin-top:var(--size-sm)}
    .cmp-counter-row .helper{flex:1;margin-top:0}
    .cmp-counter{flex-shrink:0;font-size:12px;font-variant-numeric:tabular-nums;color:var(--color-info-tertiary)}
    .cmp-counter.over{font-weight:700;color:var(--color-status-error)}
    .cmp-or{display:flex;align-items:center;gap:var(--size-xl);margin:var(--size-huge) 0}
    .cmp-or::before,.cmp-or::after{content:"";flex:1;height:1px;background:var(--color-neutral-border)}
    .cmp-record-cta{width:100%}
    .cmp-record-note{margin-top:var(--size-lg);text-align:center;font-size:12px;line-height:1.5;color:var(--color-info-secondary)}
    .cmp-photos-attached{display:flex;align-items:center;gap:var(--size-md);margin-top:var(--size-huge);padding:var(--size-xl);border:1px solid var(--color-neutral-border);border-radius:var(--radius-xl);background:var(--color-surface-card);font-family:var(--font-body);font-size:12px;line-height:1.45;color:var(--color-info-secondary)}
    .cmp-photos-attached .mi{flex-shrink:0;font-size:var(--icon-sm);color:var(--color-action-primary)}
    .cmp-mic-blocked{display:flex;align-items:flex-start;gap:var(--size-lg);margin-top:var(--size-xl);padding:var(--size-xl);border-radius:var(--radius-2xl);background:color-mix(in oklab,var(--color-status-error) 8%,transparent);font-size:12.5px;line-height:1.5;color:var(--color-status-error)}
    .cmp-mic-blocked .mi{flex-shrink:0;font-size:var(--icon-sm)}
    .cmp-audio-card{display:flex;flex-direction:column;gap:var(--size-xl)}
    .cmp-audio-ready,.cmp-audio-failed{display:flex;align-items:center;gap:var(--size-lg);font-size:12.5px;line-height:1.45}
    .cmp-audio-ready{color:var(--color-status-success)}
    .cmp-audio-failed{flex-wrap:wrap;color:var(--color-status-error)}
    .cmp-audio-failed>span:nth-child(2){flex:1;min-width:140px}
    .cmp-audio-remove{width:100%}

    /* step 2 · photos */
    .cmp-add-photo{width:100%}
    .cmp-photo-grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--size-lg)}
    .cmp-photo,.cmp-photo-add{position:relative;aspect-ratio:1;overflow:hidden;border-radius:var(--radius-2xl);background:var(--color-surface-secondary)}
    .cmp-photo{border:1px solid var(--color-neutral-border)}
    .cmp-photo img{width:100%;height:100%;display:block;object-fit:cover}
    .cmp-photo-veil{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--size-sm);border:0;background:color-mix(in oklab,var(--color-surface-media-scrim) 62%,transparent);color:var(--color-neutral-white);font-family:var(--font-body);font-size:11px;font-weight:700}
    .cmp-photo-veil.failed{cursor:pointer}
    .cmp-photo-veil .mi{font-size:var(--icon-md)}
    .cmp-photo-remove{position:absolute;top:6px;right:6px;width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:var(--radius-circle);padding:0;cursor:pointer;background:color-mix(in oklab,var(--color-info-primary) 78%,transparent);color:var(--color-info-primary-inverse)}
    .cmp-photo-remove .mi{font-size:var(--icon-sm)}
    .cmp-photo-add{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;border:1px dashed var(--color-input-border);background:var(--color-input-background);color:var(--color-action-primary);font-family:var(--font-body);font-size:11px;font-weight:700}
    .cmp-photo-add .mi{font-size:var(--icon-md)}
    .cmp-photo-meta{display:flex;align-items:center;gap:var(--size-xl);margin-top:var(--size-xl)}
    .cmp-photo-meta .helper{margin-top:0}

    /* step 3 · audience */
    .cmp-audience-group{display:flex;flex-direction:column;gap:var(--size-lg)}

    /* step 4 · review — the musalleen-facing preview */
    .cmp-review-list{margin-top:var(--size-2xl);border:1px solid var(--color-neutral-border);border-radius:var(--radius-2xl);background:var(--color-surface-card)}
    .cmp-review-row{display:flex;align-items:center;gap:var(--size-lg);padding:12px var(--size-2xl);border-bottom:1px solid var(--color-neutral-border)}
    .cmp-review-copy{flex:1;min-width:0;display:flex;flex-direction:column}
    .cmp-review-copy small{font-size:11.5px;color:var(--color-info-secondary)}
    .cmp-review-copy strong{font-size:14px;font-weight:600}

    /* full-screen recorder stage */
    .rec-control-spacer{width:48px;flex-shrink:0}
    .rec-stage .rec-control{background:color-mix(in oklab,var(--color-neutral-white) 16%,transparent);color:var(--color-neutral-white)}
    .rec-stagearea{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--size-huge);padding:0 24px}
    .rec-wave{display:flex;align-items:center;gap:3px;width:100%;height:120px}
    .rec-wave i{flex:1;min-width:2px;border-radius:var(--radius-xs);background:color-mix(in oklab,var(--color-neutral-white) 34%,transparent);height:var(--h)}
    .rec-wave.live i{background:var(--color-action-primary);animation:rec-bounce var(--motion-emphasized) ease-in-out infinite alternate}
    .rec-wave.static i{background:color-mix(in oklab,var(--color-action-primary) 72%,transparent)}
    @keyframes rec-bounce{from{transform:scaleY(.35)}to{transform:scaleY(1)}}
    .rec-time{font-family:var(--font-body);font-size:38px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
    .rec-live-label{display:flex;align-items:center;gap:var(--size-md);font-family:var(--font-body);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:color-mix(in oklab,var(--color-neutral-white) 78%,transparent)}
    .rec-live-label.calm{color:var(--color-action-primary)}
    .rec-controls{display:flex;flex-direction:column;align-items:center;gap:var(--size-lg);padding:0 24px 40px}
    .rec-stop{width:72px;height:72px;display:flex;align-items:center;justify-content:center;border:3px solid var(--color-neutral-white);border-radius:var(--radius-circle);background:transparent;cursor:pointer}
    .rec-stop::after{content:"";width:30px;height:30px;border-radius:var(--radius-md);background:var(--color-status-error);transition:transform var(--motion-press) var(--ease-out)}
    .rec-stop:active::after{transform:scale(.86)}
    .rec-hint{font-family:var(--font-body);font-size:12px;color:color-mix(in oklab,var(--color-neutral-white) 68%,transparent)}
    .rec-actions{display:flex;flex-direction:column;align-items:center;gap:var(--size-md);padding:0 20px 34px}
    .rec-actions .btn-filled{width:100%}
    .rec-actions .btn-link{color:var(--color-neutral-white)}

    /* photo library sheet + crop stage */
    .cmp-picker{max-height:86%}
    .cmp-picker-head{display:flex;align-items:center;justify-content:space-between;gap:var(--size-xl)}
    .cmp-picker-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--size-md);margin-top:var(--size-2xl);overflow-y:auto}
    .cmp-picker-item{position:relative;aspect-ratio:1;overflow:hidden;border:0;border-radius:var(--radius-xl);padding:0;cursor:pointer;background:var(--color-surface-secondary)}
    .cmp-picker-item img{width:100%;height:100%;display:block;object-fit:cover}
    .cmp-picker-item:active{transform:scale(.97)}
    .cmp-crop .camera-viewport{height:min(420px,calc(100% - 254px))}
    .cmp-crop-frame{position:absolute;inset:24px;border:1px solid color-mix(in oklab,var(--color-neutral-white) 82%,transparent);border-radius:var(--radius-md);pointer-events:none}
    .cmp-crop-frame>span{position:absolute;width:22px;height:22px;border:2px solid var(--color-neutral-white)}
    .cmp-crop-frame>span:nth-child(1){top:-2px;left:-2px;border-right:0;border-bottom:0}
    .cmp-crop-frame>span:nth-child(2){top:-2px;right:-2px;border-left:0;border-bottom:0}
    .cmp-crop-frame>span:nth-child(3){bottom:-2px;left:-2px;border-right:0;border-top:0}
    .cmp-crop-frame>span:nth-child(4){bottom:-2px;right:-2px;border-left:0;border-top:0}

    @view-transition{navigation:auto}
    ::view-transition-group(masjid-admin-masjid-e-bilal-title){animation-duration:var(--motion-emphasized);animation-timing-function:var(--ease-out)}
    @media(prefers-reduced-motion:reduce){
      .ops-rec-dot,.ops-step{animation:none}
      .rec-wave.live i{animation:none;transform:none}
      ::view-transition-group(masjid-admin-masjid-e-bilal-title){animation-duration:0ms}
    }
  </style>
  <link rel="stylesheet" href="./storyboards/broadcast-studio.css">
</helmet>

<!-- Component layer: loads Dialog/EmptyState/ListItem onto window for the screens -->
<x-import component="Dialog" from="../_theme/components.jsx" hint-size="0,0"></x-import>
<x-import component="PickerField" from="../_theme/components.jsx" hint-size="0,0"></x-import>
<x-import component="OptionSheet" from="../_theme/components.jsx" hint-size="0,0"></x-import>
<!-- Screen kit loader (the screens are used by both the board and the device below) -->
<div style="display:none">
  <x-import component="ConsoleScreen" from="./storyboards/broadcast-studio-screens.jsx" hint-size="0,0"></x-import>
  <!-- Onboarding's Personal Details screen, reused by the invitation inbox for a member with no name yet -->
  <x-import component="PersonalDetailsScreen" from="../personal-details/storyboards/screens.jsx" hint-size="0,0"></x-import>
  <x-import component="ComposePostScreen" from="./storyboards/broadcast-studio-compose.jsx" hint-size="0,0"></x-import>
</div>

<x-import component="BoardHeader" from="../_theme/board.jsx"
          title="Masjid Console"
          subtitle="The finalised masjid console, built from the approved broadcast-first direction. Home entry, role-aware hub, committee, musalleen, masjid details, guided media composer, confirmations, invitations and all loading, empty, error, locked and success states live here. Salaah timings are their own section board — the hub's Salaah tile opens it."
          hint-size="1440px,92px"></x-import>

<div class="poc-stage">
  <div class="poc-frames">
    <x-import component="OpsBoard" from="./storyboards/broadcast-studio-board.jsx"
              active="{{ activeFrame }}" on-select-frame="{{ selectFrame }}"
              hint-size="1600px,5200px"></x-import>
  </div>

  <x-import component="BoardLive" from="../_theme/board.jsx" restart="{{ restart }}"
            hint-size="400px,900px">
    <x-import component="IOSDevice" from="../ios-frame.jsx" hint-size="402px,874px">
      <div style="width:100%;height:100%;position:relative;overflow:hidden;background:var(--color-surface-primary)">

        <sc-if value="{{ isConsole }}">
          <div class="{{ stepAnim }}" style="position:absolute;inset:0">
            <x-import component="ConsoleScreen" from="./storyboards/broadcast-studio-screens.jsx"
                      data="{{ data }}" transition-enabled="true" hint-size="100%,100%"></x-import>
          </div>
        </sc-if>

        <sc-if value="{{ isCreate }}">
          <div class="{{ stepAnim }}" style="position:absolute;inset:0">
            <x-import component="ComposePostScreen" from="./storyboards/broadcast-studio-compose.jsx"
                      data="{{ data }}" hint-size="100%,100%"></x-import>
          </div>
        </sc-if>

        <sc-if value="{{ isSent }}">
          <div class="{{ stepAnim }}" style="position:absolute;inset:0">
            <x-import component="PostSentScreen" from="./storyboards/broadcast-studio-screens.jsx"
                      data="{{ data }}" hint-size="100%,100%"></x-import>
          </div>
        </sc-if>

        <sc-if value="{{ isInvitations }}">
          <div class="{{ stepAnim }}" style="position:absolute;inset:0">
            <x-import component="InvitationsScreen" from="./storyboards/broadcast-studio-screens.jsx"
                      data="{{ data }}" hint-size="100%,100%"></x-import>
          </div>
        </sc-if>

      </div>
    </x-import>
  </x-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  // Entry points used by the Index / other boards.
  HASH_ROUTES = {
    '#admin': {},
    '#home': {},
    '#members': { dest: 'members' },
    '#followers': { dest: 'followers' },
    '#member': { dest: 'member', memberId: 'm3' },
    '#can-post': { caps: ['post'], role: 'IMAM' },
    '#view-only': { caps: [], role: 'MUEZZIN' },
    '#details': { dest: 'details' },
    '#invite': { dest: 'invite' },
    '#create': { route: 'create' },
    '#invitations': { route: 'invitations' },
    '#invitation-details': { route: 'invitations', needsDetails: true, invitationDetails: { id: 'i1', name: '', gender: null, nameError: false, genderError: false, saving: null, shakeKey: 0 } },
    '#locked': { consoleStatus: 'locked', role: 'MEMBER' },
  };

  state = window.opsApplyPatch(window.OPS_DEFAULT_STATE, this.HASH_ROUTES[window.location.hash] || {});

  _timers = [];

  componentWillUnmount() { this.clearTimers(); }

  clearTimers = () => {
    this._timers.forEach((t) => { clearTimeout(t); clearInterval(t); });
    this._timers = [];
  };

  after = (ms, fn) => { this._timers.push(setTimeout(fn, ms)); };

  patch = (p) => this.setState((s) => window.opsApplyPatch(s, p));

  // Transient confirmation. Mirrors the ShowToast effects the ViewModels already emit.
  toast = (kind, message, tone) => {
    this.patch({ snack: { kind, message, tone: tone || 'success' } });
    this.after(2600, () => this.patch({ snack: null }));
  };

  hide = (id) => this.setState((s) => window.opsApplyPatch(s, { hidden: s.hidden.concat([id]) }));

  // ── Navigation ──
  onBack = () => {
    const s = this.state;
    if (s.route === 'create') { this.onComposeBack(); return; }
    if (s.route === 'sent') { this.patch({ route: 'console', dest: 'home', stepDir: 'back' }); return; }
    if (s.route === 'invitations') { this.patch({ route: 'console', stepDir: 'back' }); return; }
    if (s.dest === 'member' || s.dest === 'invite') { this.patch({ dest: 'members', memberId: null, openMenu: null, stepDir: 'back' }); return; }
    if (s.dest !== 'home') {
      this.patch({ dest: 'home', openMenu: null, memberId: null, stepDir: 'back' });
      return;
    }
    this.transitionTo({ route: 'entry', stepDir: 'back' });
  };
  onHome = () => this.transitionTo({ route: 'entry', stepDir: 'back' });
  onExplore = () => { window.location.href = '../masjid-explore/Explore Masjids.dc.html#map'; };

  // Hub → destination. The row label and the destination title share a view-transition
  // name, so the push reads as a container transform instead of a cut.
  transitionTo = (patch) => {
    const update = () => this.patch(patch);
    const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (!reduced && document.startViewTransition) document.startViewTransition(update);
    else update();
  };
  // Salaah timings are their own section board now — the day, each prayer's rule, publishing and
  // the change record all live on ./Salaah Timing Rules.dc.html. The tile hands the destination
  // over rather than the console carrying a second copy of the editor.
  goSalaahTimings = () => { window.location.href = './Salaah Timing Rules.dc.html#timings'; };

  onOpenDest = (dest) => {
    if (dest === 'salaah') { this.goSalaahTimings(); return; }
    this.transitionTo({ dest, openMenu: null, memberId: null, postMenuFor: null, stepDir: 'none' });
  };
  onCloseDest = () => this.transitionTo({ dest: 'home', openMenu: null, memberId: null, stepDir: 'none' });

  onOpenAttention = (id) => {
    if (id === 'pending-invites') this.onOpenDest('members');
  };

  onCloseSnack = () => this.patch({ snack: null });
  onCancelConfirm = () => this.patch({ confirm: null });

  // ── Retry / reload ──
  onRetry = () => {
    const s = this.state;
    if (s.route === 'invitations') {
      this.patch({ invitationsStatus: 'loading' });
      this.after(900, () => this.patch({ invitationsStatus: 'loaded' }));
      return;
    }
    if (s.consoleStatus === 'error') {
      this.patch({ consoleStatus: 'loading' });
      this.after(900, () => this.patch({ consoleStatus: 'loaded' }));
      return;
    }
    if (s.dest === 'home') {
      this.patch({ postsStatus: 'loading' });
      this.after(900, () => this.patch({ postsStatus: 'loaded' }));
    } else if (s.dest === 'members') {
      this.patch({ membersStatus: 'loading' });
      this.after(900, () => this.patch({ membersStatus: 'loaded' }));
    }
  };
  // ── Musalleen ──
  onLoadFollowers = () => {
    this.patch({ followersLoadingMore: true });
    this.after(900, () => this.setState((st) => window.opsApplyPatch(st, {
      followersLoadingMore: false,
      followersPage: Math.min((st.followersPage || 4) + 2, (window.OPS_FOLLOWERS || []).length),
    })));
  };

  // ── Masjid details ──
  onRequestCorrection = () => this.toast('correction-requested', 'Paigham support will call you about the correction');

  onRetryFollowers = () => {
    this.patch({ followersStatus: 'loading' });
    this.after(900, () => this.patch({ followersStatus: 'loaded' }));
  };

  // ── Posts ──
  // `intent` comes from the composer card's secondary actions ('audio' | 'photos'). It only
  // pre-opens the stage that action promised; the draft still starts at step 1, so the
  // message-or-recording rule cannot be skipped by entering through a shortcut. Callers that
  // pass a click event (the FAB, the empty feed) fall through to the plain start.
  onCreatePost = (intent) => {
    const mode = intent === 'audio' || intent === 'photos' ? intent : 'message';
    this.patch({
      route: 'create',
      stepDir: 'fwd',
      postMenuFor: null,
      post: Object.assign(
        {},
        window.OPS_DEFAULT_STATE.post,
        mode === 'message' ? { focusMessage: true, focusMessageKey: 1 } : null,
        mode === 'audio' ? { recorder: { stage: 'recording', elapsed: '0:00' } } : null,
        mode === 'photos' ? { picker: true } : null,
      ),
    });
  };

  // ── Masjid switcher ──
  onOpenSwitcher = () => this.patch({ switcherOpen: true, postMenuFor: null });
  onCloseSwitcher = () => this.patch({ switcherOpen: false });
  onPickMasjid = (masjidId) => {
    if (this.state.transferringId) return;
    const pick = (window.OPS_MANAGED || []).find((m) => m.id === masjidId);
    // Switching from inside compose retargets the draft; it must not throw the author back
    // to the hub and lose what they have written.
    const composing = this.state.route === 'create';
    this.patch(Object.assign(
      { switcherOpen: false, masjidId, role: pick ? pick.role : this.state.role },
      composing ? {} : { dest: 'home' },
    ));
    if (pick) this.toast('masjid-switched', composing ? `Sending from ${pick.name}` : `Now managing ${pick.name}`);
  };

  onTogglePostMenu = (postMenuFor) => this.patch({ postMenuFor });

  onDeletePost = (post) => this.patch({ confirm: { kind: 'deletePost', id: post.id }, postMenuFor: null });

  // ── Committee & permissions ──
  // The member screen's role list opens through this.
  onOpenMenu = (openMenu) => this.patch({ openMenu });

  onOpenMember = (member) => this.transitionTo({ dest: 'member', memberId: member.id, openMenu: null });
  onPickRole = (role) => {
    const id = this.state.memberId;
    const data = window.buildOpsData(this.state, {});
    const member = (data.members.items || []).find((m) => m.id === id);
    if (!member || !data.me || !window.OPS_CAPS.isAdmin(data.caps) || (!data.me.isOwner && (member.isOwner || window.OPS_CAPS.isAdmin(member.caps)))) return;
    const available = window.opsAvailableCommitteeRoles(data.members.items, id);
    if (available.indexOf(role) === -1) {
      this.toast('role-taken', 'That committee role is already assigned', 'error');
      return;
    }
    this.setState((st) => window.opsApplyPatch(st, {
      openMenu: null,
      roleOverrides: Object.assign({}, st.roleOverrides, { [id]: role }),
    }));
    this.toast('role-changed', `${member ? member.name : 'Member'} is now ${window.opsRoleLabel(role)}`);
  };
  // Capability toggles are the whole permission model: grant or revoke one at a time.
  onToggleCapability = (memberId, capId) => {
    const data = window.buildOpsData(this.state, {});
    const member = (data.members.items || []).find((m) => m.id === memberId);
    if (!member || !data.me || !window.OPS_CAPS.isAdmin(data.caps) || this.state.transferringId) return;
    if (!data.me.isOwner && (member.isOwner || window.OPS_CAPS.isAdmin(member.caps) || capId === 'committee')) return;
    if (member.isOwner && capId === 'committee') return;
    const current = member.caps || [];
    const next = current.indexOf(capId) === -1
      ? current.concat([capId])
      : current.filter((c) => c !== capId);
    this.setState((st) => window.opsApplyPatch(st, {
      capOverrides: Object.assign({}, st.capOverrides, { [memberId]: next }),
    }));
    const cap = (window.OPS_CAPS || {}).find ? window.OPS_CAPS.find(capId) : null;
    const label = cap ? cap.label : capId;
    this.toast('cap-changed', current.indexOf(capId) === -1
      ? `${member.name} can now: ${label}`
      : `${label} removed for ${member.name}`);
  };
  onOpenTransfer = (member) => {
    const data = window.buildOpsData(this.state, {});
    if (!data.me || !data.me.isOwner || !window.OPS_CAPS.isAdmin(data.caps) || this.state.transferringId) return;
    this.patch({ transferError: false, confirm: { kind: 'transferOwnership', id: member.id } });
  };
  onOpenRemove = (member) => this.patch({ confirm: { kind: 'removeMember', id: member.id } });
  onWithdrawInvitation = (member) => {
    const data = window.buildOpsData(this.state, {});
    if (!data.me || !window.OPS_CAPS.isAdmin(data.caps) || (window.OPS_CAPS.isAdmin(member.caps) && !data.me.isOwner)) return;
    this.patch({ confirm: { kind: 'withdrawInvitation', id: member.id } });
  };

  // The invite is a destination screen, so opening it is navigation, not a flag.
  onOpenInvite = () => this.transitionTo({
    dest: 'invite', memberId: null, openMenu: null,
    invite: { phone: '', role: null, caps: [], sending: false, error: null },
  });
  onInvitePhone = (phone) => this.patch({ invite: { phone, error: null } });
  onInviteRole = (role) => {
    const data = window.buildOpsData(this.state, {});
    const available = window.opsAvailableCommitteeRoles(data.members.items, null);
    if (available.indexOf(role) === -1) {
      this.toast('role-taken', 'That committee role is already assigned', 'error');
      return;
    }
    this.patch({ invite: { role }, openMenu: null });
  };
  onInviteCapability = (capId) => this.setState((st) => {
    const data = window.buildOpsData(st, {});
    if (capId === 'committee' && (!data.me || !data.me.isOwner)) return st;
    const caps = st.invite.caps || [];
    return window.opsApplyPatch(st, {
      invite: { caps: caps.indexOf(capId) === -1 ? caps.concat([capId]) : caps.filter((c) => c !== capId) },
    });
  });
  onSendInvite = () => {
    const invite = this.state.invite;
    if ((invite.phone || '').replace(/\D/g, '').length < 10) {
      this.patch({ invite: { error: 'Enter a valid 10-digit mobile number.' }, openMenu: null });
      return;
    }
    const data = window.buildOpsData(this.state, {});
    if (window.opsIsCommitteePhoneTaken(data.members.items, invite.phone)) {
      this.patch({
        invite: { error: 'This number is already a member or has a pending invitation.' },
        openMenu: null,
      });
      return;
    }
    const available = window.opsAvailableCommitteeRoles(data.members.items, null);
    if (available.indexOf(invite.role) === -1) {
      this.patch({ invite: { error: 'That committee role is already assigned.' }, openMenu: null });
      return;
    }
    this.patch({ invite: { sending: true, error: null }, openMenu: null });
    this.after(1000, () => {
      const id = `m-invited-${Date.now()}`;
      this.setState((st) => window.opsApplyPatch(st, {
        dest: 'members',
        invite: { phone: '', role: null, caps: [], sending: false, error: null },
        extraMembers: st.extraMembers.concat([{
          id, name: `+91 ${st.invite.phone}`, phone: `+91 ${st.invite.phone}`,
          role: st.invite.role, status: 'INVITED', caps: st.invite.caps,
        }]),
      }));
      this.toast('invite-sent', 'Invitation sent · valid for 7 days');
    });
  };

  // ── Send a paigham (the compose wizard) ──
  STEPS = ['message', 'photos', 'audience', 'review'];

  onMessage = (message) => this.patch({ post: { message, messageError: false } });

  onGoToStep = (step) => this.patch({ post: { step }, stepDir: 'back' });

  onNextStep = () => {
    const post = this.state.post;
    const i = this.STEPS.indexOf(post.step || 'message');
    if (i === 0) {
      const message = (post.message || '').trim();
      const audioReady = !!post.audio && !post.audio.uploading && !post.audio.failed;
      const invalidMessage = !message || (post.message || '').length > (window.MAX_POST_MESSAGE || 1024);
      if (!audioReady && invalidMessage) {
        this.patch({ post: {
          messageError: true,
          focusMessage: true,
          focusMessageKey: (post.focusMessageKey || 0) + 1,
        } });
        return;
      }
    }
    if (i < this.STEPS.length - 1) {
      this.patch({ post: { step: this.STEPS[i + 1], messageError: false, focusMessage: false }, stepDir: 'fwd' });
      return;
    }
    // Step 4 IS the confirmation — sending happens straight from the review.
    this.patch({ post: { submitting: true } });
    this.after(1400, () => this.patch({ route: 'sent', stepDir: 'fwd', post: { submitting: false } }));
  };

  // Back steps through the wizard; leaving step 1 with content asks before discarding.
  onComposeBack = () => {
    const post = this.state.post;
    const i = this.STEPS.indexOf(post.step || 'message');
    if (i > 0) { this.patch({ post: { step: this.STEPS[i - 1] }, stepDir: 'back' }); return; }
    const hasDraft = (post.message || '').trim().length > 0 || !!post.audio || (post.photos || []).length > 0;
    if (hasDraft) { this.patch({ confirm: { kind: 'discardDraft' } }); return; }
    this.patch({ route: 'console', dest: 'home', stepDir: 'back' });
  };

  // recorder stage
  onOpenRecorder = () => {
    if (this.state.post.micBlocked) { this.patch({ post: { recorder: { stage: 'blocked' } } }); return; }
    this.onStartRecording();
  };
  onStartRecording = () => {
    this.patch({ post: { recorder: { stage: 'recording', elapsed: '0:00' } } });
    let seconds = 0;
    const tick = setInterval(() => {
      const rec = this.state.post.recorder;
      if (!rec || rec.stage !== 'recording') { clearInterval(tick); return; }
      seconds += 1;
      this.patch({ post: { recorder: { stage: 'recording', elapsed: `${Math.floor(seconds / 60)}:${String(seconds % 60).padStart(2, '0')}` } } });
    }, 1000);
    this._timers.push(tick);
  };
  onStopRecording = () => this.setState((st) => window.opsApplyPatch(st, {
    post: { recorder: { stage: 'review', elapsed: (st.post.recorder || {}).elapsed || '0:04' } },
  }));
  onCloseRecorder = () => this.patch({ post: { recorder: null } });
  onRetryMic = () => this.patch({ post: { micBlocked: false, recorder: { stage: 'recording', elapsed: '0:00' } } });
  onUseRecording = () => {
    const duration = (this.state.post.recorder || {}).elapsed || '0:24';
    this.patch({ post: { recorder: null, audio: { uploading: true, failed: false, duration } } });
    this.after(1300, () => this.patch({ post: { audio: { uploading: false, failed: false, playing: false, progress: 0.32, duration } } }));
  };
  onRemoveAudio = () => this.patch({ post: { audio: null } });
  onRetryAudio = () => {
    const duration = (this.state.post.audio || {}).duration || '0:24';
    this.patch({ post: { audio: { uploading: true, failed: false, duration } } });
    this.after(1100, () => this.patch({ post: { audio: { uploading: false, failed: false, playing: false, progress: 0.32, duration } } }));
  };
  onToggleAudio = () => this.setState((st) => window.opsApplyPatch(st, {
    post: { audio: Object.assign({}, st.post.audio, { playing: !(st.post.audio || {}).playing }) },
  }));

  // photo library → crop → local draft. Upload begins only from the final Send paigham action.
  onOpenPicker = () => this.patch({ post: { picker: true } });
  onClosePicker = () => this.patch({ post: { picker: false } });
  onPickPhoto = (src) => this.patch({ post: { picker: false, crop: { src, rotation: 0 } } });
  onRotateCrop = () => this.setState((st) => window.opsApplyPatch(st, {
    post: { crop: Object.assign({}, st.post.crop, { rotation: (((st.post.crop || {}).rotation || 0) + 90) % 360 }) },
  }));
  onCancelCrop = () => this.patch({ post: { crop: null } });
  onUseCrop = () => {
    const src = (this.state.post.crop || {}).src;
    const id = `ph-${Date.now()}`;
    this.setState((st) => window.opsApplyPatch(st, {
      post: { crop: null, photos: st.post.photos.concat([{ id, src }]) },
    }));
  };
  onRemovePhoto = (index) => this.setState((st) => window.opsApplyPatch(st, {
    post: { photos: st.post.photos.filter((_, i) => i !== index) },
  }));
  onAudience = (audience) => this.patch({ post: { audience } });

  onAnother = () => this.patch({ route: 'create', stepDir: 'fwd', post: window.OPS_DEFAULT_STATE.post });

  // ── Invitations ──
  // A member with no name yet gives it first: the committee list is a name and a role per row,
  // and an accepted member with no name is a blank row on every admin's list.
  onAccept = (invitation) => {
    if (this.state.needsDetails) {
      this.patch({ invitationDetails: { id: invitation.id, name: '', gender: null, nameError: false, genderError: false, saving: null, shakeKey: 0 } });
      return;
    }
    this.patch({ invitationActioning: { id: invitation.id, kind: 'accept' } });
    this.after(900, () => this.finishAccept(invitation));
  };
  // Where an accepted invitation lands. The LAST live one hands over to the console behind a
  // named loader — the inbox has nothing left to come back to. Any other becomes the success
  // card and offers the console: accepting a role is only useful if it hands you the thing you
  // were given.
  finishAccept = (invitation) => {
    const s = this.state;
    // One accepted card at a time: an earlier accept still offering its console leaves the list
    // now, rather than falling back to a pending card the reader already answered.
    const hidden = s.invitationAcceptedId ? s.hidden.concat([s.invitationAcceptedId]) : s.hidden;
    const live = (window.OPS_INVITATIONS || []).filter(
      (i) => !i.expired && i.id !== invitation.id && hidden.indexOf(i.id) === -1
    );
    if (!live.length) {
      this.patch({ invitationActioning: null, invitationAcceptedId: null, invitationHandoff: invitation.id, hidden });
      this.after(1100, () => this.onOpenAcceptedConsole(invitation));
      return;
    }
    this.patch({ invitationActioning: null, invitationAcceptedId: invitation.id, hidden });
    this.toast('invitation-accepted', 'Invitation accepted');
  };
  patchDetails = (change) => this.patch({ invitationDetails: Object.assign({}, this.state.invitationDetails, change) });
  onDetailsName = () => {
    const d = this.state.invitationDetails || {};
    this.patchDetails({ name: d.name ? '' : 'Toufeeq Ahamed', nameError: false });
  };
  onDetailsGender = (gender) => this.patchDetails({ gender, genderError: false });
  onDetailsBack = () => this.patch({ invitationDetails: null });
  onDetailsDismiss = () => this.patchDetails({ saving: null });
  onDetailsRetry = () => { this.patchDetails({ saving: null }); this.onDetailsSubmit(); };
  // Save and accept: validate as onboarding does, then three requests in a fixed order — save the
  // name and gender, follow the masjid (it becomes the member's primary), accept the invitation.
  onDetailsSubmit = () => {
    const d = this.state.invitationDetails;
    if (!d) return;
    const nameBad = (d.name || '').trim().length < 3;
    const genderBad = !d.gender;
    if (nameBad || genderBad) {
      this.patchDetails({ nameError: nameBad, genderError: genderBad, shakeKey: (d.shakeKey || 0) + 1 });
      return;
    }
    const invitation = (window.OPS_INVITATIONS || []).find((i) => i.id === d.id);
    this.patchDetails({ saving: 'details', nameError: false, genderError: false });
    this.after(900, () => {
      this.patchDetails({ saving: 'following' });
      this.after(900, () => {
        this.patchDetails({ saving: 'accepting' });
        this.after(900, () => {
          this.patch({ needsDetails: false, invitationDetails: null });
          if (invitation) this.finishAccept(invitation);
        });
      });
    });
  };
  onOpenAcceptedConsole = (invitation) => {
    this.clearTimers();
    const managed = (window.OPS_MANAGED || []).find((m) => m.name === invitation.name);
    this.patch({
      route: 'console',
      dest: 'home',
      stepDir: 'fwd',
      invitationAcceptedId: null,
      invitationHandoff: null,
      hidden: this.state.hidden.concat([invitation.id]),
      masjidId: managed ? managed.id : this.state.masjidId,
      role: invitation.role,
      caps: invitation.caps || [],
    });
  };
  onDecline = (invitation) => this.patch({ confirm: { kind: 'declineInvitation', id: invitation.id } });

  // ── One confirm handler; the pending descriptor decides what actually happens ──
  onConfirmAction = () => {
    const confirm = this.state.confirm;
    if (!confirm) return;
    this.patch({ confirm: null });

    if (confirm.kind === 'deletePost') {
      this.patch({ deletingId: confirm.id });
      this.after(800, () => { this.hide(confirm.id); this.patch({ deletingId: null }); this.toast('post-deleted', 'Post deleted'); });
      return;
    }
    if (confirm.kind === 'transferOwnership') {
      const data = window.buildOpsData(this.state, {});
      const target = data.members.items.find((m) => m.id === confirm.id);
      if (!data.me || !data.me.isOwner || !window.OPS_CAPS.isAdmin(data.caps) || !target || target.status !== 'ACTIVE') return;
      const originMasjid = this.state.masjidId;
      const originOwner = this.state.ownerId;
      this.patch({ transferringId: target.id });
      this.after(700, () => {
        if (this.state.masjidId !== originMasjid || this.state.ownerId !== originOwner || this.state.transferringId !== target.id) return;
        this.patch({ ownerId: target.id, transferringId: null,
          capOverrides: Object.assign({}, this.state.capOverrides, { [target.id]: Array.from(new Set(target.caps.concat(['committee']))) }) });
        this.toast('ownership-transferred', 'Ownership transferred');
      });
      return;
    }
    if (confirm.kind === 'removeMember') {
      const data = window.buildOpsData(this.state, {});
      const member = data.members.items.find((m) => m.id === confirm.id);
      if (!member || member.isOwner || (!member.you && (!window.OPS_CAPS.isAdmin(data.caps) || (!data.me.isOwner && window.OPS_CAPS.isAdmin(member.caps))))) return;
      this.hide(confirm.id);
      if (member.you) {
        this.patch({ caps: [], consoleStatus: 'locked', dest: 'home', memberId: null, ownerId: null });
        this.toast('committee-left', 'You left the committee');
        return;
      }
      if (this.state.dest === 'member') this.transitionTo({ dest: 'members', memberId: null });
      this.toast('member-removed', `${member ? member.name : 'Member'} removed from the committee`);
      return;
    }
    if (confirm.kind === 'withdrawInvitation') {
      const data = window.buildOpsData(this.state, {});
      const target = data.members.items.find((m) => m.id === confirm.id);
      if (!data.me || !target || !window.OPS_CAPS.isAdmin(data.caps) || (window.OPS_CAPS.isAdmin(target.caps) && !data.me.isOwner)) return;
      this.patch({ withdrawingId: confirm.id });
      this.after(700, () => { this.hide(confirm.id); this.patch({ withdrawingId: null }); this.toast('invitation-withdrawn', 'Invitation withdrawn'); });
      return;
    }
    if (confirm.kind === 'declineInvitation') {
      this.patch({ invitationActioning: { id: confirm.id, kind: 'decline' } });
      this.after(700, () => { this.hide(confirm.id); this.patch({ invitationActioning: null }); this.toast('invitation-declined', 'Invitation declined'); });
      return;
    }
    if (confirm.kind === 'discardDraft') {
      this.clearTimers();
      this.patch({ route: 'console', dest: 'home', stepDir: 'back', post: window.OPS_DEFAULT_STATE.post });
      return;
    }
  };

  // ── Board ⇄ device ──
  selectFrame = (index) => {
    this.clearTimers();
    const frame = (window.OPS_FRAMES || [])[index];
    if (!frame) return;
    this.setState(Object.assign(window.opsFrameState(frame), { stepDir: 'none' }));
  };

  restart = () => {
    this.clearTimers();
    this.setState(window.opsApplyPatch(window.OPS_DEFAULT_STATE, { stepDir: 'none' }));
  };

  renderVals() {
    const s = this.state;
    const handlers = {
      onBack: this.onBack, onHome: this.onHome, onExplore: this.onExplore,
      onOpenDest: this.onOpenDest, onCloseDest: this.onCloseDest, onOpenAttention: this.onOpenAttention,
      onRetry: this.onRetry, onRetryFollowers: this.onRetryFollowers,
      onLoadFollowers: this.onLoadFollowers,
      onRequestCorrection: this.onRequestCorrection,
      onCloseSnack: this.onCloseSnack, onCancelConfirm: this.onCancelConfirm,
      onConfirmAction: this.onConfirmAction,
      onCreatePost: this.onCreatePost, onDeletePost: this.onDeletePost,
      onOpenSwitcher: this.onOpenSwitcher, onCloseSwitcher: this.onCloseSwitcher,
      onPickMasjid: this.onPickMasjid, onTogglePostMenu: this.onTogglePostMenu,
      onToggleMemberMenu: this.onToggleMemberMenu,
      onOpenMember: this.onOpenMember, onPickRole: this.onPickRole,
      onToggleCapability: this.onToggleCapability,
      onOpenTransfer: this.onOpenTransfer, onOpenRemove: this.onOpenRemove, onWithdrawInvitation: this.onWithdrawInvitation, onOpenInvite: this.onOpenInvite,
      onInvitePhone: this.onInvitePhone, onInviteRole: this.onInviteRole,
      onInviteCapability: this.onInviteCapability, onSendInvite: this.onSendInvite,
      onOpenMenu: this.onOpenMenu,
      onDone: this.onDone,
      onMessage: this.onMessage, onNextStep: this.onNextStep, onGoToStep: this.onGoToStep,
      onOpenRecorder: this.onOpenRecorder, onStartRecording: this.onStartRecording,
      onStopRecording: this.onStopRecording, onCloseRecorder: this.onCloseRecorder,
      onRetryMic: this.onRetryMic, onUseRecording: this.onUseRecording,
      onRemoveAudio: this.onRemoveAudio, onRetryAudio: this.onRetryAudio, onToggleAudio: this.onToggleAudio,
      onOpenPicker: this.onOpenPicker, onClosePicker: this.onClosePicker, onPickPhoto: this.onPickPhoto,
      onRotateCrop: this.onRotateCrop, onCancelCrop: this.onCancelCrop, onUseCrop: this.onUseCrop,
      onRemovePhoto: this.onRemovePhoto,
      onAudience: this.onAudience, onAnother: this.onAnother,
      onAccept: this.onAccept, onDecline: this.onDecline,
      onDetailsName: this.onDetailsName, onDetailsGender: this.onDetailsGender,
      onDetailsSubmit: this.onDetailsSubmit, onDetailsBack: this.onDetailsBack,
      onDetailsRetry: this.onDetailsRetry, onDetailsDismiss: this.onDetailsDismiss,
      onOpenAcceptedConsole: this.onOpenAcceptedConsole,
    };

    return {
      data: window.buildOpsData ? window.buildOpsData(s, handlers) : {},
      isConsole: s.route === 'console',
      isCreate: s.route === 'create',
      isSent: s.route === 'sent',
      isInvitations: s.route === 'invitations',
      stepAnim: s.stepDir && s.stepDir !== 'none' ? 'ops-step' : '',
      activeFrame: window.opsActiveFrameIndex ? window.opsActiveFrameIndex(s) : -1,
      selectFrame: this.selectFrame,
      restart: this.restart,
    };
  }
}
</script>
</body>
